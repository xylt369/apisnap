base_url = "http://127.0.0.1:8080"
timeout = "10s"
concurrency = 5
snapshot_dir = "__snapshots__"

[global_headers]
"Accept" = "application/json"

[masking]
enable_builtin_heuristics = true

[[endpoints]]
name = "health_check"
method = "GET"
path = "/api/v1/health"
expected_status = 200

[[endpoints]]
name = "checkout_order"
method = "POST"
path = "/api/v1/checkout"
expected_status = 201

[endpoints.headers]
"Content-Type" = "application/json"

[endpoints.body]
item_id = "GIN-998"
quantity = 1
