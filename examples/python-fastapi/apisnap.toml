base_url = "http://127.0.0.1:8000"
timeout = "10s"
concurrency = 5
snapshot_dir = "__snapshots__"

[global_headers]
"Accept" = "application/json"

[masking]
enable_builtin_heuristics = true

[[endpoints]]
name = "get_user_profile"
method = "GET"
path = "/api/v1/users/123"
