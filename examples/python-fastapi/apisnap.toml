[[endpoints]]
name = "create_order"
method = "POST"
path = "/api/v1/orders"
expected_status = 201

[endpoints.headers]
"Content-Type" = "application/json"

[endpoints.body]
item_id = "SKU-PRO-01"
quantity = 3
